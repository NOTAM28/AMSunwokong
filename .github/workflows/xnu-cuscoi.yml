name: xnu-cuscoi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - "scripts/**"
      - ".github/workflows/xnu-cuscoi.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch XNU
        run: |
          set -euo pipefail
          git clone --depth 1 --branch xnu-8796.101.5 \
            https://github.com/apple-oss-distributions/xnu.git xnu-src
          cd xnu-src && git log -1 --oneline

      - name: Apply patches
        run: |
          chmod +x scripts/apply-patches.sh
          ./scripts/apply-patches.sh xnu-src xnu/patches

      - name: Prep board + clang noise
        working-directory: xnu-src
        run: |
          set -euo pipefail
          find . -type f \( -name '*.h' -o -name '*.c' -o -name '*.cpp' -o -name 'Makefile*' -o -name '*.mk' -o -name 'MASTER*' \) \
            -print0 2>/dev/null | xargs -0 grep -l 'sweet_early' 2>/dev/null \
            | while read -r f; do sed -i.bak 's/sweet_early/cuscoi_early/g' "$f" || true; done
          mkdir -p osfmk/arm64
          printf '%s\n' '#ifndef _ARM64_CUSCOI_EARLY_H_' '#define _ARM64_CUSCOI_EARLY_H_' '#endif' > osfmk/arm64/cuscoi_early.h
          mkdir -p bsd/sys BUILD/obj/bsd/sys
          echo '/* stub */' > bsd/sys/_symbol_aliasing.h
          echo '/* stub */' > bsd/sys/_posix_availability.h
          cp -f bsd/sys/_symbol_aliasing.h bsd/sys/_posix_availability.h BUILD/obj/bsd/sys/ || true
          printf '#!/bin/bash\nexit 0\n' > bsd/sys/make_symbol_aliasing.sh
          chmod +x bsd/sys/make_symbol_aliasing.sh
          H=libkern/c++/OSMetaClass.h
          if [ -f "$H" ] && ! grep -q 'CI: xcode15' "$H"; then
            { echo '/* CI: xcode15 */'; echo '#pragma clang diagnostic push';
              echo '#pragma clang diagnostic ignored "-Wsuggest-override"';
              echo '#pragma clang diagnostic ignored "-Wsuggest-destructor-override"';
              cat "$H"; } > "$H.tmp" && mv "$H.tmp" "$H"
          fi
          # Keep filename SweetPlatformExpert.cpp (Makefile lists it); fix shadow only
          if [ -f iokit/Kernel/arm/SweetPlatformExpert.cpp ]; then
            sed -i.bak \
              -e 's/processTopLevel(IORegistryEntry \*root)/processTopLevel(IORegistryEntry *rootEntry)/g' \
              -e 's/processTopLevel(root)/processTopLevel(rootEntry)/g' \
              iokit/Kernel/arm/SweetPlatformExpert.cpp || true
            # only rename the *parameter* uses inside that function body carefully:
            # if still fails, -Wshadow-field is ignored via pragma below
          fi

      - name: Build
        working-directory: xnu-src
        run: |
          set -euo pipefail
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          export SDKROOT
          BIN="$GITHUB_WORKSPACE/ci-bin"
          OFF="$GITHUB_WORKSPACE/ci-werror-off.h"
          mkdir -p "$BIN"
          cat > "$OFF" << 'H'
          #pragma clang diagnostic ignored "-Wsuggest-override"
          #pragma clang diagnostic ignored "-Wsuggest-destructor-override"
          #pragma clang diagnostic ignored "-Wunused-but-set-variable"
          #pragma clang diagnostic ignored "-Wunused-variable"
          #pragma clang diagnostic ignored "-Wdeprecated-declarations"
          #pragma clang diagnostic ignored "-Wdeclaration-after-statement"
          #pragma clang diagnostic ignored "-Wshadow-field"
          #pragma clang diagnostic ignored "-Wnull-pointer-subtraction"
          #pragma clang diagnostic ignored "-Wvoid-pointer-to-int-cast"
          #pragma clang diagnostic ignored "-Wcast-align"
          #pragma clang diagnostic ignored "-Wshorten-64-to-32"
          #pragma clang diagnostic ignored "-Wsign-compare"
          #pragma clang diagnostic ignored "-Wunused-function"
          #pragma clang diagnostic ignored "-Wpointer-to-int-cast"
          #pragma clang diagnostic ignored "-Wsingle-bit-bitfield-constant-conversion"
          #pragma clang diagnostic ignored "-Wbitfield-constant-conversion"
          #pragma clang diagnostic ignored "-Wenum-conversion"
          #pragma clang diagnostic ignored "-Wformat"
          #pragma clang diagnostic ignored "-Wunreachable-code"
          H
          REAL_CLANG=$(xcrun -f clang)
          REAL_CXX=$(xcrun -f clang++)
          printf '#!/bin/bash\nexec "%s" -include "%s" "$@"\n' "$REAL_CLANG" "$OFF" > "$BIN/clang"
          printf '#!/bin/bash\nexec "%s" -include "%s" "$@"\n' "$REAL_CXX" "$OFF" > "$BIN/clang++"
          printf '#!/bin/bash\nexec "%s" -E -include "%s" "$@"\n' "$REAL_CLANG" "$OFF" > "$BIN/cpp-wrap"
          chmod +x "$BIN/clang" "$BIN/clang++" "$BIN/cpp-wrap"
          make ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT MACHINE_CONFIGS=CUSCOI \
            SDKROOT="$SDKROOT" \
            CC="$BIN/clang" CXX="$BIN/clang++" CPP="$BIN/cpp-wrap" \
            -j$(sysctl -n hw.ncpu) 2>&1 | tee ../build.log

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -v build.log out/ 2>/dev/null || true
          find xnu-src -type f -name 'kernel*' 2>/dev/null | tee out/find.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            sz=$(wc -c < "$f" | tr -d ' ')
            [ "$sz" -gt 1000000 ] && cp -v "$f" "out/$(basename "$f")"
          done < out/find.txt || true
          ls -la out
          grep -E 'error:|fatal error:' build.log 2>/dev/null | grep -v warning | head -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-cuscoi-ada
          path: out/
          if-no-files-found: warn
