name: xnu-cuscoi
on:
  workflow_dispatch:
  push:
    paths:
      - "xnu/patches/**"
      - "scripts/**"
      - ".github/workflows/xnu-cuscoi.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout Project-Ada
        uses: actions/checkout@v4

      - name: Fetch XNU (xnu-8796.101.5)
        run: |
          set -euo pipefail
          # Tag exists on apple-oss-distributions/xnu (iOS 16-era family)
          git clone --depth 1 --branch xnu-8796.101.5 \
            https://github.com/apple-oss-distributions/xnu.git xnu-src
          cd xnu-src
          git log -1 --oneline
          ls | head

      - name: Apply first-wave patches
        run: |
          chmod +x scripts/apply-patches.sh
          ./scripts/apply-patches.sh xnu-src xnu/patches

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          clang --version | head -2

      - name: Build kernel (best-effort)
        working-directory: xnu-src
        run: |
          set +e
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          export SDKROOT
          echo "SDKROOT=$SDKROOT"
          make ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT MACHINE_CONFIGS=CUSCOI \
            SDKROOT="$SDKROOT" -j$(sysctl -n hw.ncpu) 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "CUSCOI build failed ($status); retry without MACHINE_CONFIGS"
            make ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT \
              SDKROOT="$SDKROOT" -j$(sysctl -n hw.ncpu) 2>&1 | tee -a ../build.log
          fi
          tail -100 ../build.log
          # do not fail the job solely on make yet — collect logs
          exit 0

      - name: Collect outputs
        run: |
          mkdir -p out
          cp -v build.log out/ 2>/dev/null || true
          find xnu-src -type f \( -name 'kernel*' -o -path '*/BUILD/*' \) 2>/dev/null \
            | head -100 | tee out/find.txt || true
          find xnu-src -type f -name 'kernel*' -size +1M -exec cp -v {} out/ \; 2>/dev/null || true
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-cuscoi-ada
          path: out/
          if-no-files-found: warn
