name: xnu-cuscoi
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Fetch XNU
        run: |
          set -euo pipefail
          git clone --depth 1 --branch xnu-8796.101.5 https://github.com/apple-oss-distributions/xnu.git xnu-src
          cd xnu-src && git log -1 --oneline
      - name: Apply patches
        run: |
          chmod +x scripts/apply-patches.sh
          ./scripts/apply-patches.sh xnu-src xnu/patches
      - name: Prep
        working-directory: xnu-src
        run: |
          set -euo pipefail
          find . -type f \( -name '*.h' -o -name '*.c' -o -name '*.cpp' -o -name 'Makefile*' -o -name '*.mk' -o -name 'MASTER*' \) -print0 2>/dev/null | xargs -0 grep -l 'sweet_early' 2>/dev/null | while read -r f; do sed -i.bak 's/sweet_early/cuscoi_early/g' "$f" || true; done
          mkdir -p osfmk/arm64
          cat > osfmk/arm64/cuscoi_early.h << 'EH'
          #ifndef _ARM64_CUSCOI_EARLY_H_
          #define _ARM64_CUSCOI_EARLY_H_
          #ifdef __cplusplus
          extern "C" {
          #endif
          static inline void cuscoi_early_mark(int stage, const char *msg) { (void)stage; (void)msg; }
          static inline void cuscoi_early_disable(void) { }
          static inline void cuscoi_early_putc(char c) { (void)c; }
          static inline void cuscoi_early_puts(const char *s) { (void)s; }
          #ifdef __cplusplus
          }
          #endif
          #endif
          EH
          mkdir -p iokit/Kernel/arm
          cat > iokit/Kernel/arm/SweetPlatformExpert.cpp << 'PE'
          #include <IOKit/IOLib.h>
          #include <IOKit/IOPlatformExpert.h>
          class SweetPlatformExpert : public IOPlatformExpert {
              OSDeclareDefaultStructors(SweetPlatformExpert)
          public:
              virtual bool start(IOService *provider) APPLE_KEXT_OVERRIDE;
          };
          OSDefineMetaClassAndStructors(SweetPlatformExpert, IOPlatformExpert)
          bool SweetPlatformExpert::start(IOService *provider) { return IOPlatformExpert::start(provider); }
          PE
          mkdir -p bsd/sys BUILD/obj/bsd/sys
          echo '/* stub */' > bsd/sys/_symbol_aliasing.h
          echo '/* stub */' > bsd/sys/_posix_availability.h
          cp -f bsd/sys/_symbol_aliasing.h bsd/sys/_posix_availability.h BUILD/obj/bsd/sys/ || true
          printf '#!/bin/bash\nexit 0\n' > bsd/sys/make_symbol_aliasing.sh
          chmod +x bsd/sys/make_symbol_aliasing.sh
          H=libkern/c++/OSMetaClass.h
          if [ -f "$H" ] && ! grep -q 'CI: xcode15' "$H"; then
            { echo '/* CI: xcode15 */'; echo '#pragma clang diagnostic push'; echo '#pragma clang diagnostic ignored "-Wsuggest-override"'; echo '#pragma clang diagnostic ignored "-Wsuggest-destructor-override"'; cat "$H"; } > "$H.tmp" && mv "$H.tmp" "$H"
          fi
          mkdir -p libkern/os BUILD/obj/EXPORT_HDRS/libkern/os BUILD/obj/EXPORT_HDRS/os
          cat > libkern/os/firehose_buffer_private.h << 'FH'
          #ifndef _OS_FIREHOSE_BUFFER_PRIVATE_H_
          #define _OS_FIREHOSE_BUFFER_PRIVATE_H_
          #ifndef FIREHOSE_BUFFER_KERNEL_DEFAULT_CHUNK_COUNT
          #define FIREHOSE_BUFFER_KERNEL_DEFAULT_CHUNK_COUNT 64
          #endif
          #ifndef FIREHOSE_BUFFER_KERNEL_DEFAULT_IO_PAGES
          #define FIREHOSE_BUFFER_KERNEL_DEFAULT_IO_PAGES 4
          #endif
          #ifndef FIREHOSE_BUFFER_KERNEL_CHUNK_COUNT
          #define FIREHOSE_BUFFER_KERNEL_CHUNK_COUNT FIREHOSE_BUFFER_KERNEL_DEFAULT_CHUNK_COUNT
          #endif
          #ifndef FIREHOSE_CHUNK_SIZE
          #define FIREHOSE_CHUNK_SIZE 4096
          #endif
          #define __firehose_buffer_tracepoint_reserve(...) ((void *)0)
          #define __firehose_buffer_tracepoint_flush(a, b) ((void)(a), (void)(b))
          #define __firehose_buffer_get_kernel() ((void *)0)
          #endif
          FH
          cp -f libkern/os/firehose_buffer_private.h BUILD/obj/EXPORT_HDRS/libkern/os/
          cp -f libkern/os/firehose_buffer_private.h BUILD/obj/EXPORT_HDRS/os/ 2>/dev/null || true
      - name: Build
        working-directory: xnu-src
        run: |
          set -euo pipefail
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          export SDKROOT
          BIN="$GITHUB_WORKSPACE/ci-bin"
          OFF="$GITHUB_WORKSPACE/ci-werror-off.h"
          mkdir -p "$BIN"
          cat > "$OFF" << 'H'
          #pragma clang diagnostic ignored "-Wsuggest-override"
          #pragma clang diagnostic ignored "-Wsuggest-destructor-override"
          #pragma clang diagnostic ignored "-Wunused-but-set-variable"
          #pragma clang diagnostic ignored "-Wunused-variable"
          #pragma clang diagnostic ignored "-Wdeprecated-declarations"
          #pragma clang diagnostic ignored "-Wdeclaration-after-statement"
          #pragma clang diagnostic ignored "-Wshadow-field"
          #pragma clang diagnostic ignored "-Wnull-pointer-subtraction"
          #pragma clang diagnostic ignored "-Wvoid-pointer-to-int-cast"
          #pragma clang diagnostic ignored "-Wpointer-to-int-cast"
          #pragma clang diagnostic ignored "-Wcast-align"
          #pragma clang diagnostic ignored "-Wshorten-64-to-32"
          #pragma clang diagnostic ignored "-Wsign-compare"
          #pragma clang diagnostic ignored "-Wunused-function"
          #pragma clang diagnostic ignored "-Wsingle-bit-bitfield-constant-conversion"
          #pragma clang diagnostic ignored "-Wbitfield-constant-conversion"
          #pragma clang diagnostic ignored "-Wenum-conversion"
          #pragma clang diagnostic ignored "-Wtautological-value-range-compare"
          #pragma clang diagnostic ignored "-Wtautological-compare"
          #pragma clang diagnostic ignored "-Wfour-char-constants"
          #pragma clang diagnostic ignored "-Wimplicit-function-declaration"
          #pragma clang diagnostic ignored "-Wincompatible-pointer-types"
          #pragma clang diagnostic ignored "-Wcompare-distinct-pointer-types"
          #pragma clang diagnostic ignored "-Wint-conversion"
          #pragma clang diagnostic ignored "-Wpointer-sign"
          #pragma clang diagnostic ignored "-Wc2x-compat"
          H
          REAL_CLANG=$(xcrun -f clang)
          REAL_CXX=$(xcrun -f clang++)
          printf '#!/bin/bash\nexec "%s" -include "%s" "$@"\n' "$REAL_CLANG" "$OFF" > "$BIN/clang"
          printf '#!/bin/bash\nexec "%s" -include "%s" "$@"\n' "$REAL_CXX" "$OFF" > "$BIN/clang++"
          printf '#!/bin/bash\nexec "%s" -E -include "%s" "$@"\n' "$REAL_CLANG" "$OFF" > "$BIN/cpp-wrap"
          chmod +x "$BIN/clang" "$BIN/clang++" "$BIN/cpp-wrap"
          # Stub libfirehose_kernel for linker
          STUBDIR="$GITHUB_WORKSPACE/ci-lib"
          mkdir -p "$STUBDIR"
          echo 'void __firehose_kernel_unused_stub(void){}' > /tmp/fh_empty.c
          $(xcrun -f clang) -c /tmp/fh_empty.c -o /tmp/fh_empty.o
          $(xcrun -f ar) rcs "$STUBDIR/libfirehose_kernel.a" /tmp/fh_empty.o
          export LIBRARY_PATH="$STUBDIR:${LIBRARY_PATH:-}"
          export LDFLAGS="${LDFLAGS:-} -L$STUBDIR"
          # Stub closed libfirehose_kernel + force kernel entry __start
          STUBDIR="$GITHUB_WORKSPACE/ci-lib"
          mkdir -p "$STUBDIR"
          echo 'void __firehose_kernel_unused_stub(void){}' > /tmp/fh_empty.c
          $(xcrun -f clang) -c /tmp/fh_empty.c -o /tmp/fh_empty.o
          $(xcrun -f ar) rcs "$STUBDIR/libfirehose_kernel.a" /tmp/fh_empty.o
          export LIBRARY_PATH="$STUBDIR:${LIBRARY_PATH:-}"
          export LDFLAGS="${LDFLAGS:-} -L$STUBDIR -u __start -e __start"
          # firehose + exact __start object (XNU ignores plain LDFLAGS often)
          STUBDIR="$GITHUB_WORKSPACE/ci-lib"
          mkdir -p "$STUBDIR"
          echo 'void __firehose_kernel_unused_stub(void){}' > /tmp/fh_empty.c
          $(xcrun -f clang) -c /tmp/fh_empty.c -o /tmp/fh_empty.o
          $(xcrun -f ar) rcs "$STUBDIR/libfirehose_kernel.a" /tmp/fh_empty.o
          START_C="$GITHUB_WORKSPACE/xnu-patches/cuscoi_start.c"
          $(xcrun -f clang) -c -arch arm64 -O2 -fno-stack-protector -o "$STUBDIR/cuscoi_start.o" "$START_C"
          # prove symbol name is __start not ___start
          nm "$STUBDIR/cuscoi_start.o" | grep -E ' __start$' || { echo "BAD SYMBOL:"; nm "$STUBDIR/cuscoi_start.o"; exit 1; }
          export LIBRARY_PATH="$STUBDIR:${LIBRARY_PATH:-}"
          # XNU uses OTHER_LDFLAGS / LDFLAGS_KERNEL on many trees
          export OTHER_LDFLAGS="${OTHER_LDFLAGS:-} $STUBDIR/cuscoi_start.o -e __start"
          export LDFLAGS_KERNEL="${LDFLAGS_KERNEL:-} $STUBDIR/cuscoi_start.o -e __start"
          export LDFLAGS="${LDFLAGS:-} -L$STUBDIR $STUBDIR/cuscoi_start.o -u __start -e __start"
          make ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT MACHINE_CONFIGS=CUSCOI SDKROOT="$SDKROOT" CC="$BIN/clang" CXX="$BIN/clang++" CPP="$BIN/cpp-wrap" -j$(sysctl -n hw.ncpu) 2>&1 | tee ../build.log
      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -v build.log out/ 2>/dev/null || true
          find xnu-src -type f -name 'kernel*' 2>/dev/null | tee out/find.txt || true
          while IFS= read -r f; do [ -f "$f" ] || continue; sz=$(wc -c < "$f" | tr -d ' '); [ "$sz" -gt 1000000 ] && cp -v "$f" "out/$(basename "$f")"; done < out/find.txt || true
          ls -la out
          grep -E 'error:|fatal error:' build.log 2>/dev/null | grep -v warning | head -40 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-cuscoi-ada
          path: out/
          if-no-files-found: warn
