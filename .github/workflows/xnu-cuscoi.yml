name: xnu-cuscoi
on:
  workflow_dispatch:
  push:
    paths:
      - "xnu/patches/**"
      - "scripts/**"
      - ".github/workflows/xnu-cuscoi.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch XNU (xnu-8796.101.5)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch xnu-8796.101.5 \
            https://github.com/apple-oss-distributions/xnu.git xnu-src
          cd xnu-src && git log -1 --oneline

      - name: Apply first-wave patches
        run: |
          chmod +x scripts/apply-patches.sh
          ./scripts/apply-patches.sh xnu-src xnu/patches

      - name: Fix sweet leftovers + availability stubs
        working-directory: xnu-src
        run: |
          set -euo pipefail
          find . -type f \( -name '*.h' -o -name '*.c' -o -name '*.cpp' -o -name 'Makefile*' -o -name '*.mk' -o -name 'MASTER*' \) \
            -print0 2>/dev/null | xargs -0 grep -l 'sweet_early' 2>/dev/null \
            | while read -r f; do sed -i.bak 's/sweet_early/cuscoi_early/g' "$f" || true; done
          mkdir -p osfmk/arm64
          if [ ! -f osfmk/arm64/cuscoi_early.h ]; then
            printf '%s\n' '#ifndef _ARM64_CUSCOI_EARLY_H_' '#define _ARM64_CUSCOI_EARLY_H_' '#endif' \
              > osfmk/arm64/cuscoi_early.h
          fi
          mkdir -p bsd/sys BUILD/obj/bsd/sys
          echo '/* CI stub */' > bsd/sys/_symbol_aliasing.h
          echo '/* CI stub */' > bsd/sys/_posix_availability.h
          cp -f bsd/sys/_symbol_aliasing.h bsd/sys/_posix_availability.h BUILD/obj/bsd/sys/ 2>/dev/null || true
          if [ -f bsd/sys/make_symbol_aliasing.sh ]; then
            printf '#!/bin/bash\nexit 0\n' > bsd/sys/make_symbol_aliasing.sh
            chmod +x bsd/sys/make_symbol_aliasing.sh
          fi

      - name: Source fixes for Xcode 15 -Werror
        working-directory: xnu-src
        run: |
          set -euo pipefail
          # Unused-but-set in IOUserServer / vfs_cache
          if [ -f iokit/Kernel/IOUserServer.cpp ]; then
            sed -i.bak -E 's/\b(uint64_t|unsigned long long|mach_msg_id_t)[[:space:]]+(msgid)\b/\1 \2 __attribute__((unused))/g' \
              iokit/Kernel/IOUserServer.cpp || true
            sed -i.bak -E 's/\b(uint64_t|unsigned long long|mach_port_t)[[:space:]]+(machid)\b/\1 \2 __attribute__((unused))/g' \
              iokit/Kernel/IOUserServer.cpp || true
          fi
          if [ -f bsd/vfs/vfs_cache.c ]; then
            sed -i.bak -E 's/\b(int|unsigned|u_int|size_t)[[:space:]]+(chain_len)\b/\1 \2 __attribute__((unused))/g' \
              bsd/vfs/vfs_cache.c || true
          fi
          # OSMetaClass: ignore suggest-override for this TU tree via pragma at top of header
          H=libkern/c++/OSMetaClass.h
          if [ -f "$H" ] && ! grep -q 'CI: xcode15 werror' "$H"; then
            { echo '/* CI: xcode15 werror */';
              echo '#pragma clang diagnostic push';
              echo '#pragma clang diagnostic ignored "-Wsuggest-override"';
              echo '#pragma clang diagnostic ignored "-Wsuggest-destructor-override"';
              cat "$H"; } > "$H.tmp" && mv "$H.tmp" "$H"
          fi

      - name: Build kernel DEVELOPMENT ARM64 CUSCOI
        working-directory: xnu-src
        run: |
          set -euo pipefail
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          export SDKROOT
          # Force-include on every compile (XNU uses absolute clang paths; PATH wrappers fail)
          OFF="$GITHUB_WORKSPACE/ci-werror-off.h"
          cat > "$OFF" << 'H'
          #pragma clang diagnostic ignored "-Wsuggest-override"
          #pragma clang diagnostic ignored "-Wsuggest-destructor-override"
          #pragma clang diagnostic ignored "-Wunused-but-set-variable"
          #pragma clang diagnostic ignored "-Wunused-variable"
          #pragma clang diagnostic ignored "-Wdeprecated-declarations"
          #pragma clang diagnostic ignored "-Wdeclaration-after-statement"
          H
          CLANG=$(xcrun -f clang)
          CLANGXX=$(xcrun -f clang++)
          make ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT MACHINE_CONFIGS=CUSCOI \
            SDKROOT="$SDKROOT" \
            CC="$CLANG -include $OFF" \
            CXX="$CLANGXX -include $OFF" \
            CPP="$CLANG -E -include $OFF" \
            -j$(sysctl -n hw.ncpu) 2>&1 | tee ../build.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          cp -v build.log out/ 2>/dev/null || true
          find xnu-src -type f -name 'kernel*' 2>/dev/null | tee out/find.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            sz=$(wc -c < "$f" | tr -d ' ')
            [ "$sz" -gt 1000000 ] && cp -v "$f" "out/$(basename "$f")"
          done < out/find.txt || true
          ls -la out
          echo "---- errors (if any) ----"
          grep -E 'error:|fatal error:' build.log | grep -v warning | head -40 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-cuscoi-ada
          path: out/
          if-no-files-found: warn
