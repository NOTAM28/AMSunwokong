name: xnu-cuscoi
on:
  workflow_dispatch:
  push:
    paths:
      - "xnu/patches/**"
      - "scripts/**"
      - ".github/workflows/xnu-cuscoi.yml"

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch XNU (xnu-8796.101.5)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch xnu-8796.101.5 \
            https://github.com/apple-oss-distributions/xnu.git xnu-src
          cd xnu-src && git log -1 --oneline

      - name: Apply first-wave patches
        run: |
          chmod +x scripts/apply-patches.sh
          ./scripts/apply-patches.sh xnu-src xnu/patches

      - name: Fix leftover sweet_early + seed cuscoi_early.h
        working-directory: xnu-src
        run: |
          set -euo pipefail
          # Any remaining sweet_early references → cuscoi_early
          grep -RIl 'sweet_early' . 2>/dev/null | head -50 || true
          find . -type f \( -name '*.h' -o -name '*.c' -o -name '*.cpp' -o -name 'Makefile*' -o -name '*.mk' -o -name 'MASTER*' \) \
            -print0 2>/dev/null | xargs -0 grep -l 'sweet_early' 2>/dev/null | while read -r f; do
            sed -i.bak 's/sweet_early/cuscoi_early/g' "$f" || true
          done
          mkdir -p osfmk/arm64
          # Minimal early header so export_hdrs can proceed
          if [ ! -f osfmk/arm64/cuscoi_early.h ]; then
            cat > osfmk/arm64/cuscoi_early.h << 'H'
          #ifndef _ARM64_CUSCOI_EARLY_H_
          #define _ARM64_CUSCOI_EARLY_H_
          /* cuscoi early bring-up stubs — filled by later patches */
          #endif
          H
          fi
          ls -la osfmk/arm64/*early* 2>/dev/null || true
          grep -RIn 'sweet_early' . 2>/dev/null | head -20 || echo "no sweet_early left"

      - name: Pre-generate availability headers (skip broken availability.pl)
        working-directory: xnu-src
        run: |
          set -euo pipefail
          mkdir -p bsd/sys BUILD/obj/bsd/sys
          # Empty-but-valid headers so make_symbol_aliasing is not required
          cat > bsd/sys/_symbol_aliasing.h << 'H'
          /* CI stub: symbol aliasing unavailable without SDK availability.pl */
          H
          cat > bsd/sys/_posix_availability.h << 'H'
          /* CI stub: posix availability unavailable without SDK availability.pl */
          H
          # Also plant where BUILD expects copies
          cp -f bsd/sys/_symbol_aliasing.h BUILD/obj/bsd/sys/ 2>/dev/null || true
          cp -f bsd/sys/_posix_availability.h BUILD/obj/bsd/sys/ 2>/dev/null || true
          # Neutralize the script so parallel makes don't clobber
          if [ -f bsd/sys/make_symbol_aliasing.sh ]; then
            cp bsd/sys/make_symbol_aliasing.sh bsd/sys/make_symbol_aliasing.sh.bak
            cat > bsd/sys/make_symbol_aliasing.sh << 'SH'
          #!/bin/bash
          # no-op CI stub
          exit 0
          SH
            chmod +x bsd/sys/make_symbol_aliasing.sh
          fi

      - name: Build kernel DEVELOPMENT ARM64 CUSCOI
        working-directory: xnu-src
        run: |
          set -euo pipefail
          SDKROOT=$(xcrun --sdk macosx --show-sdk-path)
          export SDKROOT
          # Xcode 15 clang is stricter than xnu-8796; demote known noise to warnings
          WARNFLAGS="-Wno-error=suggest-override -Wno-error=suggest-destructor-override"
          WARNFLAGS="$WARNFLAGS -Wno-error=unused-but-set-variable -Wno-error=unused-variable"
          WARNFLAGS="$WARNFLAGS -Wno-error=deprecated-declarations -Wno-error=declaration-after-statement"
          make ARCH_CONFIGS=ARM64 KERNEL_CONFIGS=DEVELOPMENT MACHINE_CONFIGS=CUSCOI \
            SDKROOT="$SDKROOT" \
            KCFLAGS="$WARNFLAGS" CFLAGS="$WARNFLAGS" CXXFLAGS="$WARNFLAGS" \
            OTHER_CFLAGS="$WARNFLAGS" OTHER_CXXFLAGS="$WARNFLAGS" \
            -j$(sysctl -n hw.ncpu) 2>&1 | tee ../build.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          cp -v build.log out/ 2>/dev/null || true
          find xnu-src -type f -name 'kernel*' 2>/dev/null | tee out/find.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 1000000 ] && cp -v "$f" "out/$(basename "$f")"
          done < out/find.txt || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-cuscoi-ada
          path: out/
          if-no-files-found: warn
